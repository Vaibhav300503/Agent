server:
  url: "https://carmela-unpublished-lou.ngrok-free.dev/api/v1/logs"
  api_token: "Server@123"
  verify_ssl: true
  timeout_sec: 10

agent:
  polling_interval_sec: 5
  buffer_path: "agent_buffer.db"
  max_buffer_size_mb: 100
  log_level: "INFO"

logs:
  windows_events:
    - "Security"
    - "System"
    - "Application"
    - "Microsoft-Windows-Windows Firewall With Advanced Security/Firewall"
  
  # Linux paths
  linux_files:
    - "/var/log/syslog"
    - "/var/log/auth.log"
    - "/var/log/secure"
    - "/var/log/messages"
    - "/var/log/kern.log"
    # Tailscale logs (if they are written to a file, otherwise systemd journal is needed)
    # We will assume standard syslog captures them, or add specific application logs:
    
network:
  enabled: true
  interval_sec: 60
  snapshot: true # Capture active connections
